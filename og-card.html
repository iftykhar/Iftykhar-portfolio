<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>OG Card</title>
<style>
  @font-face {
    font-family: 'Plus Jakarta Sans';
    font-style: normal;
    font-weight: 400 800;
    font-display: swap;
    src: url('./fonts/pjs-latin.woff2') format('woff2');
  }
  @font-face {
    font-family: 'Inter';
    font-style: normal;
    font-weight: 400 600;
    font-display: swap;
    src: url('./fonts/inter-latin.woff2') format('woff2');
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: #131313;
    color: #E5E2E1;
    font-family: 'Inter', sans-serif;
    position: relative;
  }
  /* Aurora orbs */
  .orb1 { position: absolute; width: 560px; height: 560px; border-radius: 50%; top: -220px; left: -120px; background: radial-gradient(circle, rgba(99,102,241,0.38), transparent 65%); filter: blur(30px); }
  .orb2 { position: absolute; width: 500px; height: 500px; border-radius: 50%; bottom: -240px; right: -100px; background: radial-gradient(circle, rgba(168,85,247,0.32), transparent 65%); filter: blur(30px); }
  .orb3 { position: absolute; width: 380px; height: 380px; border-radius: 50%; top: 40px; right: 420px; background: radial-gradient(circle, rgba(76,215,246,0.12), transparent 60%); filter: blur(30px); }
  /* Blueprint grid */
  .grid-overlay {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(199,197,208,0.07) 1px, transparent 1px),
      linear-gradient(90deg, rgba(199,197,208,0.07) 1px, transparent 1px);
    background-size: 46px 46px;
    -webkit-mask-image: radial-gradient(ellipse 80% 80% at 30% 40%, #000 20%, transparent 75%);
    mask-image: radial-gradient(ellipse 80% 80% at 30% 40%, #000 20%, transparent 75%);
  }
  .content { position: absolute; inset: 0; display: flex; align-items: center; padding: 0 72px; }
  .left { flex: 1.15; position: relative; z-index: 2; }
  .right { flex: 0.85; display: flex; justify-content: center; position: relative; z-index: 2; }
  /* Badge */
  .badge {
    display: inline-flex; align-items: center; gap: 10px;
    padding: 10px 18px; border-radius: 999px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.14);
    backdrop-filter: blur(8px);
    font-size: 15px; font-weight: 600; letter-spacing: 0.22em; text-transform: uppercase;
    color: #76D7F6; font-family: 'Plus Jakarta Sans', sans-serif;
  }
  .dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: #22C55E;
    box-shadow: 0 0 0 0 rgba(34,197,94,0.5);
  }
  .kicker {
    margin-top: 22px;
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-weight: 700; font-size: 16px;
    letter-spacing: 0.34em; text-transform: uppercase;
    color: #8E8E96;
  }
  .kicker b { color: #fff; }
  h1 {
    margin-top: 14px;
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-weight: 800;
    font-size: 62px;
    line-height: 1.08;
    letter-spacing: -0.02em;
    color: #E5E2E1;
  }
  h1 .grad { background: linear-gradient(135deg,#818CF8,#C084FC); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .role {
    margin-top: 18px;
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-weight: 700; font-size: 19px;
    letter-spacing: 0.3em; text-transform: uppercase;
    color: #8E8E96;
  }
  .role span { color: #A5B4FC; }
  .chips { display: flex; gap: 10px; margin-top: 30px; flex-wrap: wrap; }
  .chip {
    padding: 8px 14px; border-radius: 8px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.14);
    font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
    font-size: 14px; font-weight: 600;
    color: #C9C6D0; letter-spacing: 0.02em;
  }
  .url {
    margin-top: 32px;
    font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
    font-size: 16px; color: #6F6E78;
    letter-spacing: 0.02em;
  }
  .url b { color: #A78BFA; font-weight: 600; }
  /* Portrait */
  .frame {
    position: relative;
    width: 332px; height: 332px;
    border-radius: 34px;
    padding: 3px;
    background: linear-gradient(135deg, #6366F1, #A855F7);
    box-shadow: 0 30px 80px rgba(0,0,0,0.55), 0 0 60px rgba(99,102,241,0.25);
  }
  .frame img { width: 100%; height: 100%; border-radius: 31px; object-fit: cover; display: block; }
  .frame .glow {
    position: absolute; inset: -40px;
    background: radial-gradient(circle at 50% 50%, rgba(99,102,241,0.35), transparent 70%);
    filter: blur(30px); z-index: -1; border-radius: 50%;
  }
  .floating {
    position: absolute; padding: 9px 15px; border-radius: 999px;
    background: rgba(19,19,19,0.75);
    border: 1px solid rgba(255,255,255,0.16);
    backdrop-filter: blur(10px);
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-weight: 700; font-size: 14px; color: #E5E2E1;
    box-shadow: 0 12px 30px rgba(0,0,0,0.35);
  }
  .f1 { top: -6px; right: -30px; }
  .f2 { bottom: -4px; left: -34px; color: #A5B4FC; }
</style>
</head>
<body>
  <div class="orb1"></div>
  <div class="orb2"></div>
  <div class="orb3"></div>
  <div class="grid-overlay"></div>
  <div class="content">
    <div class="left">
      <span class="badge"><span class="dot"></span> Available for new projects</span>
      <div class="kicker">Hi, I'm <b>Iftykhar Alam</b></div>
      <h1>I build <span class="grad">fast, human&shy;centered</span> web products.</h1>
      <div class="role"><span>Full-Stack Developer</span> &nbsp;•&nbsp; Digital Architect</div>
      <div class="chips">
        <span class="chip">React.js</span>
        <span class="chip">Next.js</span>
        <span class="chip">Laravel</span>
        <span class="chip">TypeScript</span>
        <span class="chip">AWS</span>
      </div>
      <div class="url">iftykhar-portfolio.<b>vercel.app</b></div>
    </div>
    <div class="right">
      <div class="frame">
        <div class="glow"></div>
        <img src="./image/iftykharalam.webp" alt="Iftykhar Alam"/>
        <span class="floating f1">⚡ Sub-second LCP</span>
        <span class="floating f2">98 / 100 Lighthouse</span>
      </div>
    </div>
  </div>
</body>
</html>
